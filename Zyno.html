<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creation gabut</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <style>
      .bg {
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(6px);
      }
      .txt {
        opacity: 0;
        transition: all 400ms;
        transition-delay: 1s;
        transform: translateY(15px);
      }
      .fade0 {
        opacity: 1;
        transform: translateY(0);
      }
      .ph {
        opacity: 0;
        transition: all 400ms;
        transition-delay: 700ms;
        transform: translateY(15px);
      }
      .fade1 {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
    <section
    class="w-full h-screen bg-[#ebebeb] 
    flex justify-end items-start p-[1rem]
    relative">
      <div class="absolute w-full h-full top-0 left-0 flex flex-col gap-[10px] justify-center items-center">
        <h1 class="text-2xl font-[600]">Hello Stranger</h1>
        <p>Please Click button right top</p>
      </div>
      <div
      class="bg-gray-300 rounded-[1em] p-[0.5rem] px-[1rem]
      active:scale-[1.1] active:bg-white transition-all duration-200
      absolute z-[1] shadow-black shadow-md"
      id="btn">
        Click Me ^-^
      </div>
      <div
      class="bg absolute rounded-[1em]
      transition-all duration-800 w-0 h-0 overflow-hidden flex justify-center items-center flex-col gap-[25px] text-xl"
      id="menu">
        <img src="cat.jpg" class="ph w-[100px] h-[100px] rounded-[50px] shadow-black shadow-sm" id="ph"/>
        <p class="txt" id="txt">I miss u 💗🥀</p>
      </div>
    </section>
  </body>
  <script>
    let btn = document.getElementById("btn");
    let menu = document.getElementById("menu");
    let txt = document.getElementById("txt");
    let ph = document.getElementById("ph");
    
    btn.addEventListener("click", () => {
      txt.classList.toggle("fade0");
      ph.classList.toggle("fade1");
      menu.classList.toggle("w-[300px]");
      menu.classList.toggle("h-[700px]")
    })
  </script>
</html>
