<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./assets/./img/./Alif-icon.jpg" />
  <!-- Style's / All Universe Work -->
  <link rel="stylesheet" href="./plugin/./rainbow-glow/./rainbow-glow.css" />
  <link rel="stylesheet" href="./plugin/./sticky-btn/./sticky.css" />
  <!-- CDN font awesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@r3dz0n3/fontawesome-pro@6.3.0/css/all.css">
  <!-- CDN Tailwind -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Alif Developer | Welcome</title>
</head>

<body>
  <style>
    *,
    html {
      scroll-behavior: smooth; list-style: none; text-decoration: none;
      user-select: none; box-sizing: border-box;
    }
    body {height: 100vh;} body::-webkit-scrollbar {display: none;}
    /* ================== Css Tailwind ============ */
    .center {display: flex; justify-content: center; align-items: center;}
    /*-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+*/
    .cvrBtn {transition: scale 300ms, background 300ms;}
  </style>

  <!-- === Cover page === -->
  <section id="coverPage" class="
  w-full h-screen relative hidden">

    <!-- < Title /> -->
    <div class="text-center">
      <h1 class="
        text-4xl lg:text-6xl font-semibold text-gray-500">
        Digital Silence
      </h1>
      <h1 class="
        text-2xl lg:text-4xl font-medium">
        Crafting Digital Experience
      </h1>
      <span class="
      flex center text-[10px] md:text-xs lg:text-sm font-light mt-[0.8rem]
      text-gray-500">
        From personal projects to client work <br>
        I design and build websites that bring ideas to life.
      </span>
    </div>

    <!-- < button /> -->
    <button class="
    bg-black rounded-[50px] px-[1.5rem] p-[0.3rem] mt-[1.8rem] active:scale-[1.1] active:bg-white  
    center gap-[0.4rem] text-white text-sm lg:text-base relative rainbow-glow cvrBtn Sfx1" id="cvrBtn"">
      Explore
      <i class="fa-solid fa-planet-ringed"></i>
    </button>

    <!-- < toggle music /> & src music in here -->
    <audio src="./assets/./audio/./Lost Soul.mp3" id="musicD" loop controls hidden></audio>
    <audio src="./assets/./audio/./Click.mp3" id="clickSfx" controls hidden></audio>
    <div class="
    absolute bottom-[1rem] right-[1rem] text-black border-[1px] border-black rounded-[100%] 
    p-[0.6rem] px-[0.8rem] text-center text-xs active:scale-[1.1] transition-all duration-300"
    id="cvrToggleMusic">
      <i class="fa-solid fa-music-note"></i>
    </div>

  </section>
  <!-- === /Cover Page === -->

  <!-- === Intro Welcome === -->
  <div 
  class="fixed top-0 left-0 w-full h-0 overflow-hidden transition-all duration-800 z-[5]" 
  id="introWelcome">
    <div class="bg-black relative w-full h-full center">
      <h1 class="text-white text-2xl lg:text-4xl font-medium" id="txtWelcome">Halo</h1>
    </div>
  </div>

  <!-- === Main Page === -->
  <section class="
  w-full h-[400vh] relative" id="mainPage">
    <!-- (PAGE 1) -->
    <div class="
    w-full h-[100vh] center flex-col relative">
      <!-- < Background /> -->
      <video class="
      absolute bg-[#ebebeb] top-0 left-0 w-full h-full z-[-1]" 
      src="./assets/./video/./Holosphere.mp4" 
      autoplay loop muted></video>

      <!-- < Navigation /> -->
      <div class="
      w-full h-max fixed top-0 left-0">
        <ul class="
        w-full h-full relative flex justify-between items-center p-[0.5rem] py-[1.5rem] lg:p-[1rem]">
          <!-- left -->
          <div>
            <img 
            class="w-[30px] h-[30px] lg:w-[50px] lg:h-[50px] absolute top-0 mt-[1.3rem] lg:mt-[1rem]" 
            src="./assets/./img/./Alif-icon-none.png" 
            alt="Logo">
          </div>
          <!-- Right RESPONSIF PROGRESS -->
          <ul class="flex gap-[0.5rem] lg:gap-[1.5rem]">
            <!--//List-->
            <div class="text-[11px] lg:text-[14px] center gap-[0.8rem] lg:gap-[2rem]">
              <li>Home</li>
              <li>About</li>
              <li>Project</li>
            </div>
            <!--//Contact-->
            <div class="text-[12px] lg:text-[15px] center gap-[0.1rem] lg:mr-[1rem]">
              <li class="bg-black rounded-[50px] text-white py-[0.3rem] px-[0.8rem] lg:py-[0.5rem] lg:px-[1.2rem]">
                Contact
              </li>
              <li class="bg-black rounded-[50px] text-white py-[0.3rem] px-[0.8rem] lg:py-[0.5rem] lg:px-[1.2rem]">
                <i class="fa-solid fa-arrow-down fa-rotate-by" 
                style="--fa-rotate-angle: 245deg;"></i>
              </li>
            </div>
          </ul>

        </ul>
      </div>

      <!-- < Title /> -->
      <div class="absolute flex flex-col text-center">
        <span class="text-[10px] lg:text-[15px]">Hi I'm ALIF</span>
        <h1 class="
        text-[25px] lg:text-[50px] font-[350] lg:font-[380] tracking-[3px]">
        Creative Designer <br>Front-end Developer
        </h1>
      </div>
      
      <!-- < Text Line /> -->
      <div class="absolute flex flex-col bottom-[-1.5rem] gap-[1.5rem] text-center text-[0.8rem] ig:text-[1rem]">
        <span>Scroll down</span>
        <i class="fa-solid fa-arrow-down fa-bounce"></i>
      </div>

      <!-- < social media /> -->
      <div class="w-max h-full absolute left-0 top-0">
        <div class="relative flex flex-col items-center p-[1rem] gap-[2rem] mt-[2.5rem]">
          <div class="relative">
            <div class="w-[6px] h-[6px] bg-black rounded-[50%]"></span>
            <span class="block w-[1px] h-[320px] bg-black m-[10px]"></span>
            <div class="w-[6px] h-[6px] bg-black rounded-[50%]"></span>
          </div>
          <div><i class="fa-brands fa-instagram fa-2xl"></i></div>
          <div><i class="fa-brands fa-github fa-2xl"></i></div>
          <div><i class="fa-brands fa-whatsapp fa-2xl"></i></div>
        </div>
      </div>

    </div>
  </section>
  <!-- === /Main Page === -->

  <!-- Script's / All Universe Work -->
  <script src="./JS/./cover.js"></script>

</body>
</html>
